<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat — InvoiceIQ</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="brand">
            <div class="brand-icon">IQ</div>
            <span>InvoiceIQ</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="upload.html">Upload</a>
            <a class="active" href="chat.html">AI Chat</a>
        </div>

    </nav>


    <!-- Chat Page -->
    <main class="chat-page">

        <div class="page-header centered">

            <span class="badge">AI BUSINESS ASSISTANT</span>

            <h1>Ask InvoiceIQ</h1>

            <p>
                Ask questions about your revenue, purchases,
                expenses and estimated profit.
            </p>

        </div>


        <!-- Chat Container -->
        <section class="chat-container">

            <!-- Messages -->
            <div
                class="messages"
                id="messages"
            >

                <!-- Initial AI message -->
                <div class="message ai">

                    <div class="message-avatar">
                        IQ
                    </div>

                    <div class="message-content">

                        <span class="message-label">
                            InvoiceIQ AI
                        </span>

                        <p>
                            Hello! I can analyze your business
                            data and answer questions about
                            revenue, purchases, expenses and
                            estimated profit.
                        </p>

                    </div>

                </div>

            </div>


            <!-- Suggested Questions -->
            <div class="suggestions">

                <button type="button">
                    What is my total revenue?
                </button>

                <button type="button">
                    How much did we spend on purchases?
                </button>

                <button type="button">
                    What are our total expenses?
                </button>

                <button type="button">
                    What is our estimated profit?
                </button>

                <button type="button">
                    Give me a business summary.
                </button>

            </div>


            <!-- Chat Input -->
            <form
                id="chat-form"
                class="chat-form"
            >

                <input
                    type="text"
                    id="chat-input"
                    placeholder="Ask a business question..."
                    autocomplete="off"
                >

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Send
                </button>

            </form>

        </section>

    </main>


    <script src="js/chat.js"></script>

</body>
</html>
